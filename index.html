<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora de Recepción · Casa Yuma</title>
<style>
:root{
    /* ---- TEMA CLARO (crema / beige cálido) ---- */
    --bg:#f2ecdd;
    --bg-elev:#eae3d2;
    --bg-card:#f8f4ea;
    --border:#d9d1bf;
    --text:#2f2b22;
    --text-dim:#7c7365;
    --pacific:#2C6E73;
    --gold:#a8891c;
    --wool:#f8f4ea;
    --cactus:#6b7156;
    --caracol:#88285C;
    --danger:#b0463f;
    --p-arena:#e6dfca;
    --p-agua:#d6ddd7;
    --p-malva:#e2d9df;
    --p-salvia:#dbded1;
    --p-ink:#3a3632;
    --accent-malva:#8a7580;
}
:root[data-theme="dark"]{
    /* ---- TEMA OSCURO (charcoal cálido) ---- */
    --bg:#1d1b16;
    --bg-elev:#26231d;
    --bg-card:#232019;
    --border:#3a352c;
    --text:#ece6d8;
    --text-dim:#a49b8a;
    --pacific:#5aa0a6;
    --gold:#d0b855;
    --wool:#f2ece0;
    --cactus:#9aa07f;
    --caracol:#c78aa8;
    --danger:#d6675f;
    --p-arena:#3e3824;
    --p-agua:#25322f;
    --p-malva:#382d34;
    --p-salvia:#2f342a;
    --p-ink:#e8e2d4;
    --accent-malva:#c2a7b5;
}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'PT Mono','Courier New',monospace;
    min-height:100vh;
  }
  ::selection{background:var(--pacific);color:var(--wool);}
  a{color:var(--gold);}

  /* ---------- LOGIN ---------- */
  #loginScreen{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .loginBox{
    width:100%;
    max-width:360px;
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:4px;
    padding:32px 28px;
  }
  .loginBox h1{
    font-size:15px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 4px;
  }
  .loginBox p.sub{
    color:var(--text-dim);
    font-size:12px;
    margin:0 0 24px;
  }
  label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  select, input[type=password], input[type=text], input[type=date], textarea{
    width:100%;
    background:var(--bg-card);
    border:1px solid var(--border);
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    padding:10px 12px;
    border-radius:3px;
    margin-bottom:16px;
  }
  select:focus, input:focus, textarea:focus{
    outline:2px solid var(--pacific);
    outline-offset:1px;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:3px;
    padding:10px 16px;
    font-size:13px;
    letter-spacing:.03em;
  }
  .btn-primary{background:var(--pacific);color:var(--wool);width:100%;}
  .btn-primary:hover{background:#357980;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-dim);}
  .btn-danger{background:var(--danger);color:var(--wool);}
  #loginError{color:var(--danger);font-size:12px;margin-top:-8px;margin-bottom:14px;min-height:14px;}

  /* ---------- APP SHELL ---------- */
  #app{display:none;}
  header{
    position:sticky;top:0;z-index:20;
    background:var(--bg-elev);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:10px;
  }
  header h1{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:0;}
  header .who{font-size:12px;color:var(--text-dim);}
  header .who b{color:var(--text);}
  nav{display:flex;gap:6px;}
  nav button{background:transparent;color:var(--text-dim);border:1px solid transparent;font-size:12px;padding:8px 14px;text-transform:uppercase;letter-spacing:.05em;}
  nav button.active{color:var(--text);border-color:var(--border);background:var(--bg-card);}
  .themeToggle{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:3px;width:30px;height:30px;font-size:15px;cursor:pointer;line-height:1;padding:0;}
  .themeToggle:hover{color:var(--text);border-color:var(--text-dim);}
  .whoWrap{display:flex;align-items:center;gap:12px;}
  main{max-width:960px;margin:0 auto;padding:20px;}

  .panel{display:none;}
  .panel.active{display:block;}

  /* ---------- CARDS ---------- */
  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:4px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .cardHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .cardTitle{font-size:14px;color:var(--text);margin:0 0 4px;font-weight:bold;}
  .cardMeta{font-size:11px;color:var(--text-dim);}
  .cardDetalle{font-size:13px;color:var(--text);margin:10px 0;white-space:pre-wrap;line-height:1.5;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .tag{font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:2px;border:1px solid var(--border);color:var(--text-dim);}
  .badge{font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:2px;font-weight:bold;white-space:nowrap;}
  .badge-Pendiente{background:var(--p-arena);color:var(--p-ink);}
  .badge-AcciónRequerida{background:var(--p-malva);color:var(--p-ink);}
  .badge-EsperandoRespuesta{background:var(--p-agua);color:var(--p-ink);}
  .badge-Informativo{background:var(--p-salvia);color:var(--p-ink);}
  .badge-Cerrado{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .badge-Sinestatus{background:transparent;border:1px dashed var(--border);color:var(--text-dim);}
  .diasAbierto{font-size:11px;font-weight:bold;padding:3px 8px;border-radius:2px;}
  .diasOk{color:var(--text-dim);}
  .diasWarn{color:var(--gold);}
  .diasAlert{background:var(--danger);color:var(--wool);padding:3px 8px;border-radius:2px;}

  .seguimientos{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px;}
  .seg{font-size:12px;margin-bottom:8px;padding-left:10px;border-left:2px solid var(--border);}
  .seg b{color:var(--gold);}
  .seg .segMeta{color:var(--text-dim);font-size:10px;}
  .segForm{display:flex;gap:8px;margin-top:10px;}
  .segForm textarea{margin:0;flex:1;min-height:38px;resize:vertical;}
  .segForm button{white-space:nowrap;}

  .actionsRow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

  .sectionHeading{
    font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);
    margin:28px 0 12px;padding-top:14px;border-top:1px solid var(--border);
  }
  .emptyState{
    text-align:center;color:var(--text-dim);padding:60px 20px;font-size:13px;
    border:1px dashed var(--border);border-radius:4px;
  }

  /* ---------- FORM (nueva entrada) ---------- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}

  /* ---------- FILTERS ---------- */
  .filterBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filterBar select, .filterBar input{width:auto;margin-bottom:0;min-width:130px;flex:1;}
  .filterBar input[type=text]{flex:2;min-width:180px;}

  .loadMore{display:block;margin:16px auto;}

  footer{text-align:center;color:var(--text-dim);font-size:11px;padding:30px 0;}

  /* ---------- AMENIDADES ---------- */
  .badge-Solicitada{background:var(--p-arena);color:var(--p-ink);}
  .badge-Enpreparación{background:var(--p-agua);color:var(--p-ink);}
  .badge-Lista{background:var(--p-malva);color:var(--p-ink);}
  .badge-Entregada{background:transparent;border:1px solid var(--border);color:var(--text-dim);}

  .amenGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  @media(max-width:560px){.amenGrid{grid-template-columns:1fr;}}

  .entregaLabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:2px;font-weight:bold;white-space:nowrap;}
  .entregaHoy{background:var(--p-arena);color:var(--p-ink);}
  .entregaProx{color:var(--text-dim);border:1px solid var(--border);}
  .entregaVencida{background:var(--danger);color:var(--wool);}

  .amenItems{margin:10px 0;padding-left:14px;}
  .amenItems li{font-size:13px;margin-bottom:3px;line-height:1.4;}
  .amenCeleb{display:inline-block;font-size:11px;color:var(--pacific);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}

  .amenTrace{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;}
  .amenTrace .t{font-size:11px;color:var(--text-dim);margin-bottom:3px;}
  .amenTrace .t b{color:var(--cactus);}

  .fotoEvidencia{margin-top:10px;}
  .fotoEvidencia img{max-width:160px;border:1px solid var(--border);border-radius:3px;cursor:pointer;}

  .chkAmen{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;font-size:13px;}
  .chkAmen input{width:auto;margin:2px 0 0;flex:0 0 auto;}
  .chkAmen label{margin:0;text-transform:none;letter-spacing:0;color:var(--text);font-size:13px;line-height:1.4;}
  .catGroup{margin-bottom:14px;}
  .catGroup .catName{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin:0 0 8px;}

  .tipoTag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:2px;margin-right:6px;font-weight:bold;}
  .tipoAmen{background:var(--bg-elev);border:1px solid var(--border);color:var(--text-dim);}
  .tipoDes{background:var(--p-malva);color:var(--p-ink);}
  .amenDatos{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;}
  .horaBig{font-size:20px;font-weight:bold;color:var(--accent-malva);letter-spacing:.05em;}
  .amenDatos .dato{font-size:12px;color:var(--text-dim);border:1px solid var(--border);border-radius:2px;padding:2px 8px;}

  /* Modal de edición */
  .modalOverlay{display:none;position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px;}
  .modalOverlay.open{display:flex;}
  .modalCard{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:22px;width:100%;max-width:520px;box-shadow:0 8px 40px rgba(0,0,0,.15);}
  .modalTitle{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin:0 0 14px;}
  .modalBtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
  .cardFooter{display:flex;gap:14px;margin-top:12px;border-top:1px dashed var(--border);padding-top:10px;}
  .cardFooter a{font-size:11px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;text-decoration:none;}
  .cardFooter a.editar{color:var(--pacific);}
  .cardFooter a.eliminar{color:var(--danger);}

  .subnav{display:flex;gap:8px;margin-bottom:14px;}
  .subBtn{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:3px;padding:7px 16px;font-family:inherit;font-size:12px;cursor:pointer;letter-spacing:.03em;}
  .subBtn.active{background:var(--bg-elev);color:var(--text);border-color:var(--text-dim);}
</style>
<script>
  /* Aplica el tema guardado (o el del sistema) antes de pintar, para evitar parpadeo. */
  (function(){
    try{
      var t = localStorage.getItem('cy-theme');
      if(t !== 'dark' && t !== 'light'){
        t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
  })();
</script>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="loginScreen">
  <div class="loginBox">
    <h1>Bitácora de Recepción</h1>
    <p class="sub">Casa Yuma · La Marea</p>
    <label for="loginNombre">Recepcionista</label>
    <select id="loginNombre"><option value="">Cargando…</option></select>
    <label for="loginPin">PIN</label>
    <input type="password" id="loginPin" inputmode="numeric" placeholder="••••">
    <div id="loginError"></div>
    <button class="btn-primary" id="btnLogin">Entrar</button>
  </div>
</div>

<!-- ======================= APP ======================= -->
<div id="app">
  <header>
    <h1>Bitácora · Casa Yuma</h1>
    <nav>
      <button data-panel="pendientes" class="active">Pendientes</button>
      <button data-panel="nueva">Nueva entrada</button>
      <button data-panel="historial">Historial</button>
      <button data-panel="amenidades">Amenidades</button>
    </nav>
    <div class="whoWrap">
      <button class="themeToggle" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema">☾</button>
      <div class="who"><b id="whoName"></b> · <a href="#" id="btnLogout">salir</a></div>
    </div>
  </header>

  <main>

    <!-- ---------- PENDIENTES ABIERTOS ---------- -->
    <section id="panel-pendientes" class="panel active">
      <div class="filterBar">
        <input type="text" id="fBuscarPend" placeholder="Buscar por asunto o detalle…">
        <select id="fTurnoPend">
          <option value="">Todos los turnos</option>
          <option>Matutino</option><option>Vespertino</option><option>Nocturno</option>
        </select>
        <select id="fEstatusPend">
          <option value="">Todos los estatus</option>
          <option>Pendiente</option><option>Acción Requerida</option><option>Esperando Respuesta</option>
        </select>
        <select id="fRespPend"><option value="">Todos los responsables</option></select>
      </div>
      <div id="pendientesError" style="color:var(--danger);font-size:12px;margin-bottom:10px;"></div>
      <div id="pendientesList"></div>

      <h2 class="sectionHeading">Informativos</h2>
      <div id="informativosError" style="color:var(--danger);font-size:12px;margin-bottom:10px;"></div>
      <div id="informativosList"></div>
    </section>

    <!-- ---------- NUEVA ENTRADA ---------- -->
    <section id="panel-nueva" class="panel">
      <div class="card">
        <label>Turno</label>
        <select id="nvTurno">
          <option>Matutino</option><option>Vespertino</option><option>Nocturno</option>
        </select>
        <label>Asunto</label>
        <input type="text" id="nvAsunto" placeholder="Ej. Llegada VIP con mascota">
        <label>Detalle</label>
        <textarea id="nvDetalle" rows="4" placeholder="Describe la situación completa…" style="width:100%;font-family:inherit;font-size:13px;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);color:var(--text);border-radius:3px;"></textarea>
        <div class="grid2">
          <div>
            <label>Estatus</label>
            <select id="nvEstatus">
              <option>Pendiente</option>
              <option>Acción Requerida</option>
              <option>Esperando Respuesta</option>
              <option>Informativo</option>
              <option>Cerrado</option>
            </select>
          </div>
          <div>
            <label>Responsable</label>
            <select id="nvResponsable"></select>
          </div>
        </div>
        <button class="btn-primary" id="btnGuardar">Guardar en bitácora</button>
        <div id="nvMsg" style="font-size:12px;color:var(--gold);margin-top:10px;"></div>
      </div>
    </section>

    <!-- ---------- HISTORIAL ---------- -->
    <section id="panel-historial" class="panel">
      <div class="filterBar">
        <input type="text" id="fBuscar" placeholder="Buscar por asunto o detalle…">
        <select id="fTurnoHist"><option value="">Todos los turnos</option><option>Matutino</option><option>Vespertino</option><option>Nocturno</option></select>
        <select id="fEstatusHist">
          <option value="">Todos los estatus</option>
          <option>Pendiente</option><option>Acción Requerida</option><option>Esperando Respuesta</option>
          <option>Informativo</option><option>Cerrado</option><option>Sin estatus (histórico)</option>
        </select>
      </div>
      <div id="historialList"></div>
      <button class="btn-ghost loadMore" id="btnCargarMas">Cargar más</button>
    </section>

    <!-- ---------- AMENIDADES ---------- -->
    <section id="panel-amenidades" class="panel">

      <!-- Formulario: solo Recepción -->
      <div class="card" id="amenFormCard">
        <label>Nueva solicitud</label>
        <label>Tipo de solicitud</label>
        <select id="amTipo">
          <option value="Amenidad">Amenidad</option>
          <option value="Desayuno de madrugada">Desayuno de madrugada</option>
        </select>

        <div class="amenGrid">
          <div>
            <label>Habitación</label>
            <input type="text" id="amHab" placeholder="Ej. 4">
          </div>
          <div>
            <label>Entregar el día</label>
            <input type="date" id="amFecha">
          </div>
        </div>
        <label>Nombre del huésped</label>
        <input type="text" id="amHuesped" placeholder="Nombre y apellido">

        <!-- Campos exclusivos de AMENIDAD -->
        <div id="amCamposAmenidad">
          <label>Tipo de celebración</label>
          <input type="text" id="amCeleb" placeholder="Ej. Luna de miel, cumpleaños, aniversario">
          <label style="margin-top:6px;">Amenidades a preparar</label>
          <div id="amCatalogo"></div>
        </div>

        <!-- Campos exclusivos de DESAYUNO DE MADRUGADA -->
        <div id="amCamposDesayuno" style="display:none;">
          <div class="amenGrid">
            <div>
              <label>Hora de entrega</label>
              <input type="time" id="amHora">
            </div>
            <div>
              <label>Número de personas</label>
              <input type="text" id="amPersonas" inputmode="numeric" placeholder="Ej. 2">
            </div>
          </div>
          <label>Lugar de entrega</label>
          <select id="amLugar">
            <option>Habitación</option>
            <option>Recepción</option>
            <option>Lobby</option>
          </select>
          <label>Descripción del desayuno que desean</label>
          <textarea id="amDesc" rows="2" placeholder="Ej. 2 chilaquiles verdes, café de olla, jugo de naranja, para llevar" style="width:100%;font-family:inherit;font-size:13px;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);color:var(--text);border-radius:3px;"></textarea>
        </div>

        <label>Notas para cocina / entrega</label>
        <textarea id="amNotas" rows="2" placeholder="Ej. alergias, motivo (tour / checkout temprano), etc." style="width:100%;font-family:inherit;font-size:13px;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);color:var(--text);border-radius:3px;"></textarea>

        <button class="btn-primary" id="btnAmenGuardar">Registrar solicitud</button>
        <div id="amMsg" style="font-size:12px;color:var(--gold);margin-top:10px;"></div>
      </div>

      <!-- Sub-pestañas Activas / Historial -->
      <div class="subnav" id="amenSubnav">
        <button class="subBtn active" data-amenview="activas">Activas</button>
        <button class="subBtn" data-amenview="historial">Historial</button>
      </div>

      <!-- VISTA: ACTIVAS -->
      <div id="amenViewActivas">
        <div class="filterBar">
          <input type="text" id="amFBuscar" placeholder="Buscar por habitación, huésped, desayuno…">
          <select id="amFTipo"><option value="">Todos los tipos</option><option>Amenidad</option><option>Desayuno de madrugada</option></select>
          <select id="amFEstatus"><option value="">Todos los estatus</option><option>Solicitada</option><option>En preparación</option><option>Lista</option></select>
        </div>
        <div id="amenError" style="color:var(--danger);font-size:12px;margin-bottom:10px;"></div>
        <div id="amenActivasList"></div>
      </div>

      <!-- VISTA: HISTORIAL (entregadas, automático) -->
      <div id="amenViewHistorial" style="display:none;">
        <div class="filterBar">
          <input type="text" id="amFBuscarH" placeholder="Buscar en entregadas…">
          <select id="amFTipoH"><option value="">Todos los tipos</option><option>Amenidad</option><option>Desayuno de madrugada</option></select>
        </div>
        <div id="amenEntregadasList"></div>
      </div>
    </section>

  </main>
  <footer>Casa Yuma · La Marea — bitácora interna</footer>

  <!-- ---------- MODAL EDITAR ENTRADA (bitácora) ---------- -->
  <div id="editOverlay" class="modalOverlay">
    <div class="modalCard">
      <p class="modalTitle">Editar entrada</p>
      <input type="hidden" id="edId">
      <label>Turno</label>
      <select id="edTurno">
        <option>Matutino</option><option>Vespertino</option><option>Nocturno</option>
      </select>
      <label>Asunto</label>
      <input type="text" id="edAsunto">
      <label>Detalle</label>
      <textarea id="edDetalle" rows="4" style="width:100%;font-family:inherit;font-size:13px;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);color:var(--text);border-radius:3px;"></textarea>
      <div class="grid2">
        <div>
          <label>Estatus</label>
          <select id="edEstatus">
            <option>Pendiente</option><option>Acción Requerida</option><option>Esperando Respuesta</option>
            <option>Informativo</option><option>Cerrado</option>
          </select>
        </div>
        <div>
          <label>Responsable</label>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const storage = firebase.storage();

const STATUS_ORDER = ['Acción Requerida','Pendiente','Esperando Respuesta','Informativo','Cerrado','Sin estatus (histórico)'];
const ACTIVE_STATUSES = ['Pendiente','Acción Requerida','Esperando Respuesta'];

function badgeClass(estatus){ return 'badge-' + (estatus||'Sinestatus').replace(/\s|\(|\)|í/g,''); }
function sha256(str){
  const enc = new TextEncoder().encode(str);
  return crypto.subtle.digest('SHA-256', enc).then(buf=>{
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  });
}
function fmtFecha(ts){
  if(!ts) return '—';
  let d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
}
function diasDesde(ts){
  if(!ts) return null;
  let d = ts.toDate ? ts.toDate() : new Date(ts);
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

/* ---------------- SESSION ---------------- */
const SESSION_KEY = 'yumaBitacoraSession';
function saveSession(nombre, departamento){
  localStorage.setItem(SESSION_KEY, JSON.stringify({nombre, departamento, ts: Date.now()}));
}
function loadSession(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if(!s) return null;
    if(Date.now() - s.ts > 12*3600*1000){ localStorage.removeItem(SESSION_KEY); return null; }
    return s; // {nombre, departamento}
  }catch(e){ return null; }
}

let currentUser = null;
let currentDept = 'Recepción';
let usuariosCache = [];

/* ---------------- LOGIN ---------------- */
async function cargarUsuarios(){
  const sel = document.getElementById('loginNombre');
  let snap;
  try{
    snap = await db.collection('usuarios').where('activo','==',true).orderBy('nombre').get();
  }catch(e){
    console.error(e);
    sel.innerHTML = '<option value="">Error al cargar — revisa la consola</option>';
    document.getElementById('loginError').textContent = 'No se pudo leer la lista de recepcionistas (' + e.message + ')';
    return;
  }
  usuariosCache = snap.docs.map(d=>({id:d.id, ...d.data()}));
  if(usuariosCache.length===0){
    sel.innerHTML = '<option value="">Aún no hay recepcionistas dadas de alta</option>';
    return;
  }
  sel.innerHTML = '<option value="">Selecciona tu nombre</option>' +
    usuariosCache.map(u=>`<option value="${u.id}">${u.nombre}</option>`).join('');

  const selResp = document.getElementById('nvResponsable');
  selResp.innerHTML = '<option>Todos</option>' + usuariosCache.map(u=>`<option>${u.nombre}</option>`).join('');
  const fResp = document.getElementById('fRespPend');
  fResp.innerHTML = '<option value="">Todos los responsables</option>' + usuariosCache.map(u=>`<option>${u.nombre}</option>`).join('');
}

document.getElementById('btnLogin').onclick = async ()=>{
  const id = document.getElementById('loginNombre').value;
  const pin = document.getElementById('loginPin').value.trim();
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  if(!id || !pin){ errBox.textContent = 'Selecciona tu nombre y escribe tu PIN.'; return; }
  const user = usuariosCache.find(u=>u.id===id);
  const hash = await sha256(pin);
  if(!user || user.pinHash !== hash){ errBox.textContent = 'PIN incorrecto.'; return; }
  await auth.signInAnonymously();
  currentUser = user.nombre;
  currentDept = user.departamento || 'Recepción';
  saveSession(user.nombre, currentDept);
  mostrarApp();
};

document.getElementById('btnLogout').onclick = (e)=>{
  e.preventDefault();
  localStorage.removeItem(SESSION_KEY);
  location.reload();
};

function mostrarApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoName').textContent = currentUser + ' · ' + currentDept;

  const soloAmen = (currentDept === 'Cocina' || currentDept === 'Restaurante');
  aplicarPermisos(soloAmen);
  renderCatalogo();
  iniciarListenerAmenidades();

  if(soloAmen){
    activarPanel('amenidades');
  }else{
    iniciarListenersPendientes();
    iniciarListenerInformativos();
    cargarHistorial(true);
  }
}

// Cocina y Restaurante solo ven Amenidades: se ocultan las demás pestañas,
// paneles y el formulario de alta (que es exclusivo de Recepción).
function aplicarPermisos(soloAmen){
  document.querySelectorAll('nav button').forEach(b=>{
    b.style.display = (soloAmen && b.dataset.panel!=='amenidades') ? 'none' : '';
  });
  document.getElementById('amenFormCard').style.display = soloAmen ? 'none' : '';
}

function activarPanel(nombre){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const btn = document.querySelector('nav button[data-panel="'+nombre+'"]');
  if(btn) btn.classList.add('active');
  document.getElementById('panel-'+nombre).classList.add('active');
}

/* ---------------- NAV ---------------- */
document.querySelectorAll('nav button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.panel).classList.add('active');
  };
});

/* ---------------- NUEVA ENTRADA ---------------- */
document.getElementById('btnGuardar').onclick = async ()=>{
  const asunto = document.getElementById('nvAsunto').value.trim();
  const detalle = document.getElementById('nvDetalle').value.trim();
  const msg = document.getElementById('nvMsg');
  if(!asunto){ msg.textContent = 'Escribe al menos el asunto.'; msg.style.color='var(--danger)'; return; }

    turno: document.getElementById('nvTurno').value,

    fecha: firebase.firestore.FieldValue.serverTimestamp(),
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),

    historico: false,

/* ---------------- PENDIENTES ABIERTOS (tiempo real) ---------------- */
// Ojo: se filtra SOLO por estatus (no por "pendienteVivo"). Así, cualquier
// entrada -sea nueva o migrada del Excel- que tenga un estatus activo
// aparece aquí y se puede cerrar, sin importar de dónde vino.
function iniciarListenersPendientes(){
  db.collection('bitacora')
    .where('estatus','in', ACTIVE_STATUSES)
    .orderBy('fecha','desc')
    .onSnapshot(snap=>{
      window._pendientesDocs = snap.docs;
      document.getElementById('pendientesError').textContent='';
      renderPendientes();
    }, err=>{
      console.error(err);
      document.getElementById('pendientesError').textContent =
        'Firestore necesita un índice para esta consulta. Abre la consola (F12), copia el link que aparece en el error, y pégalo en el navegador para crearlo.';
    });
}
document.getElementById('fTurnoPend').onchange = renderPendientes;
document.getElementById('fRespPend').onchange = renderPendientes;
document.getElementById('fEstatusPend').onchange = renderPendientes;
document.getElementById('fBuscarPend').oninput = renderPendientes;

function renderPendientes(){
  const docs = window._pendientesDocs || [];
  const fTurno = document.getElementById('fTurnoPend').value;
  const fResp = document.getElementById('fRespPend').value;
  const fEstatus = document.getElementById('fEstatusPend').value;
  const term = document.getElementById('fBuscarPend').value.trim().toLowerCase();
  const list = document.getElementById('pendientesList');
  const filtered = docs.filter(d=>{
    const x = d.data();
    if(fTurno && x.turno!==fTurno) return false;
    if(fResp && x.responsable!==fResp) return false;
    if(fEstatus && x.estatus!==fEstatus) return false;
    if(term && !((x.asunto||'').toLowerCase().includes(term) || (x.detalle||'').toLowerCase().includes(term))) return false;
    return true;
  });
  if(filtered.length===0){
    list.innerHTML = '<div class="emptyState">No hay pendientes abiertos con estos filtros. Todo al día ✓</div>';
    return;
  }
  list.innerHTML = filtered.map(d=>renderCard(d.id, d.data())).join('');
}

/* ---------------- INFORMATIVOS (tiempo real) ---------------- */
function iniciarListenerInformativos(){
  db.collection('bitacora')
    .where('estatus','==','Informativo')
    .orderBy('fecha','desc')
    .limit(100)
    .onSnapshot(snap=>{
      window._informativosDocs = snap.docs.filter(d=>d.data().archivado !== true);
      document.getElementById('informativosError').textContent='';
      renderInformativos();
    }, err=>{
      console.error(err);
      document.getElementById('informativosError').textContent =
        'Firestore necesita un índice para esta consulta. Abre la consola (F12), copia el link del error y pégalo en el navegador para crearlo.';
    });
}

function renderInformativos(){
  const docs = window._informativosDocs || [];
  const list = document.getElementById('informativosList');
  if(docs.length===0){
    list.innerHTML = '<div class="emptyState">Sin informativos pendientes de revisar.</div>';
    return;
  }
  list.innerHTML = docs.map(d=>renderCard(d.id, d.data())).join('');
}

/* ---------------- HISTORIAL (paginado) ---------------- */
let histLastDoc = null;
let histDocsAccum = [];

document.getElementById('fBuscar').oninput = ()=>renderHistorial();
document.getElementById('fTurnoHist').onchange = ()=>cargarHistorial(true);
document.getElementById('fEstatusHist').onchange = ()=>cargarHistorial(true);
document.getElementById('btnCargarMas').onclick = ()=>cargarHistorial(false);

async function cargarHistorial(reset){
  if(reset){ histLastDoc = null; histDocsAccum = []; }
  let q = db.collection('bitacora').orderBy('fecha','desc').limit(50);
  const fTurno = document.getElementById('fTurnoHist').value;
  const fEstatus = document.getElementById('fEstatusHist').value;
  if(fTurno) q = q.where('turno','==',fTurno);
  if(fEstatus) q = q.where('estatus','==',fEstatus);
  if(histLastDoc) q = q.startAfter(histLastDoc);
  const snap = await q.get();
  if(snap.docs.length) histLastDoc = snap.docs[snap.docs.length-1];
  histDocsAccum = histDocsAccum.concat(snap.docs);
  renderHistorial();
}

function renderHistorial(){
  const term = document.getElementById('fBuscar').value.trim().toLowerCase();
  const list = document.getElementById('historialList');
  let docs = histDocsAccum;
  if(term){
    docs = docs.filter(d=>{
      const x = d.data();
      return (x.asunto||'').toLowerCase().includes(term) || (x.detalle||'').toLowerCase().includes(term);
    });
  }
  if(docs.length===0){
    list.innerHTML = '<div class="emptyState">Sin resultados.</div>';
    return;
  }
  list.innerHTML = docs.map(d=>renderCard(d.id, d.data())).join('');
}

/* ---------------- RENDER CARD ---------------- */
// La tarjeta decide sus propios botones según el estatus, sin importar en
// qué pestaña se está mostrando (Pendientes, Informativos o Historial).
function renderCard(id, x){
  const isActive = ACTIVE_STATUSES.includes(x.estatus);
  const isInfoPendiente = x.estatus === 'Informativo' && x.archivado !== true;

  const dias = diasDesde(x.fecha);
  let diasHtml = '';
  if(dias!==null && isActive){
    let cls = 'diasOk';
    if(dias>=3 && dias<7) cls='diasWarn';
    if(dias>=7) cls='diasAlert';
    diasHtml = `<span class="diasAbierto ${cls}">${dias===0?'hoy':dias+'d abierto'}</span>`;
  }
  const segs = (x.seguimientos||[]).map(s=>`
    <div class="seg"><b>${s.autor}</b> — ${escapeHtml(s.texto)}<div class="segMeta">${fmtFecha(s.fecha)}</div></div>
  `).join('');

  let actions;
  if(isActive){
    actions = `
      <div class="seguimientos">
        ${segs}
        <div class="segForm">
          <textarea placeholder="Agregar seguimiento…" id="seg-${id}"></textarea>
          <button class="btn-ghost" onclick="agregarSeguimiento('${id}')">Enviar</button>
        </div>
      </div>
      <div class="actionsRow">
        <button class="btn-danger" onclick="cerrarPendiente('${id}')">Cerrar pendiente</button>
      </div>`;
  } else if(isInfoPendiente){
    actions = `
      ${segs ? `<div class="seguimientos">${segs}</div>` : ''}
      <div class="actionsRow">
        <button class="btn-ghost" onclick="marcarVisto('${id}')">Marcar como visto</button>
      </div>`;
  } else {
    actions = segs ? `<div class="seguimientos">${segs}</div>` : '';
  }

  return `
  <div class="card">
    <div class="cardHead">
      <div>
        <p class="cardTitle">${escapeHtml(x.asunto||'(sin asunto)')}</p>
        <p class="cardMeta">${fmtFecha(x.fecha)} · ${x.turno||'—'} · anotó ${x.autor||'—'}${x.historico?' · histórico':''}</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        ${diasHtml}
        <span class="badge ${badgeClass(x.estatus)}">${x.estatus}</span>
      </div>
    </div>
    ${x.detalle ? `<p class="cardDetalle">${escapeHtml(x.detalle)}</p>` : ''}
    ${x.seguimientoLegacy ? `<p class="cardDetalle" style="color:var(--text-dim);"><i>Seguimiento original (Excel): ${escapeHtml(x.seguimientoLegacy)}</i></p>` : ''}
    <div class="tags">
      ${x.responsable ? `<span class="tag">responsable: ${x.responsable}</span>` : ''}
    </div>
    ${actions}
    <div class="cardFooter">
      <a class="editar" onclick="abrirEditar('${id}')">Editar</a>
      <a class="eliminar" onclick="eliminarEntrada('${id}')">Eliminar</a>
    </div>
  </div>`;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function marcarVisto(id){
  await db.collection('bitacora').doc(id).update({
    archivado: true,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

/* ---------------- EDITAR / ELIMINAR ENTRADA ---------------- */
function buscarDocBitacora(id){
  const fuentes = [window._pendientesDocs, window._informativosDocs, histDocsAccum];
  for(const arr of fuentes){
    if(!arr) continue;
    const hit = arr.find(d=>d.id===id);
    if(hit) return hit.data();
  }
  return null;
}

function abrirEditar(id){
  const x = buscarDocBitacora(id);
  if(!x){ alert('No se encontró la entrada. Recarga la página e inténtalo de nuevo.'); return; }
  document.getElementById('edId').value = id;
  document.getElementById('edTurno').value = x.turno || 'Matutino';
  document.getElementById('edAsunto').value = x.asunto || '';
  document.getElementById('edDetalle').value = x.detalle || '';
  document.getElementById('edEstatus').value = x.estatus || 'Pendiente';

  // Responsables (mismo listado que la alta)
  const sel = document.getElementById('edResponsable');
  sel.innerHTML = '<option value="">— sin responsable —</option>' +
    usuariosCache.map(u=>`<option ${x.responsable===u.nombre?'selected':''}>${u.nombre}</option>`).join('');

  document.getElementById('editOverlay').classList.add('open');
}

function cerrarModalEdit(){
  document.getElementById('editOverlay').classList.remove('open');
}

async function guardarEdicion(){
  const id = document.getElementById('edId').value;
  const asunto = document.getElementById('edAsunto').value.trim();
  if(!asunto){ alert('El asunto no puede quedar vacío.'); return; }
  await db.collection('bitacora').doc(id).update({
    turno: document.getElementById('edTurno').value,
    asunto,
    detalle: document.getElementById('edDetalle').value.trim(),
    estatus: document.getElementById('edEstatus').value,
    responsable: document.getElementById('edResponsable').value,
    editadoPor: currentUser,
    editadoFecha: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  cerrarModalEdit();
  if(document.getElementById('panel-historial').classList.contains('active')) cargarHistorial(true);
}

async function eliminarEntrada(id){
  const x = buscarDocBitacora(id);
  const nombre = x ? (x.asunto || '(sin asunto)') : 'esta entrada';
  if(!confirm('¿Eliminar definitivamente "' + nombre + '"?\n\nEsta acción no se puede deshacer.')) return;
  await db.collection('bitacora').doc(id).delete();
  if(document.getElementById('panel-historial').classList.contains('active')) cargarHistorial(true);
}

async function agregarSeguimiento(id){
  const ta = document.getElementById('seg-'+id);
  const texto = ta.value.trim();
  if(!texto) return;
  await db.collection('bitacora').doc(id).update({
    seguimientos: firebase.firestore.FieldValue.arrayUnion({
      autor: currentUser, texto, fecha: firebase.firestore.Timestamp.now()
    }),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  ta.value='';
}

async function cerrarPendiente(id){
  const nota = prompt('Nota de cierre (obligatoria):');
  if(nota===null) return;
  if(!nota.trim()){ alert('Necesitas escribir una nota de cierre.'); return; }
  await db.collection('bitacora').doc(id).update({
    estatus: 'Cerrado',
    pendienteVivo: false,
    cerradoPor: currentUser,
    cerradoFecha: firebase.firestore.FieldValue.serverTimestamp(),
    seguimientos: firebase.firestore.FieldValue.arrayUnion({
      autor: currentUser, texto: '[CIERRE] ' + nota, fecha: firebase.firestore.Timestamp.now()
    }),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

  const tipo = document.getElementById('amTipo').value;
  const hab = document.getElementById('amHab').value.trim();
  const fecha = document.getElementById('amFecha').value; // YYYY-MM-DD
  const huesped = document.getElementById('amHuesped').value.trim();
  const notas = document.getElementById('amNotas').value.trim();
  const msg = document.getElementById('amMsg');

  if(!hab || !fecha || !huesped){ msg.style.color='var(--danger)'; msg.textContent='Faltan habitación, huésped o fecha de entrega.'; return; }

  let data, payload;

  if(tipo === 'Desayuno de madrugada'){
    const hora = document.getElementById('amHora').value; // HH:MM
    const personas = document.getElementById('amPersonas').value.trim();
    const lugar = document.getElementById('amLugar').value;
    const desc = document.getElementById('amDesc').value.trim();
    if(!hora){ msg.style.color='var(--danger)'; msg.textContent='Falta la hora de entrega.'; return; }
    if(!desc){ msg.style.color='var(--danger)'; msg.textContent='Describe el desayuno que desean.'; return; }

    const fechaEntrega = new Date(fecha + 'T' + hora + ':00');
    data = {
      tipo, habitacion: hab, huesped, notas,
      hora, personas, lugarEntrega: lugar, descripcionDesayuno: desc,
      fechaEntrega: firebase.firestore.Timestamp.fromDate(fechaEntrega),
      estatus: 'Solicitada',
      creadoPor: currentUser,
      creadoFecha: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      fotoURL: null, resguardo: null,
      historial: [{ estatus:'Solicitada', autor: currentUser, fecha: firebase.firestore.Timestamp.now() }]
    };
    payload = { tipo, habitacion: hab, huesped, notas, fecha, hora, personas, lugarEntrega: lugar, descripcionDesayuno: desc };

  } else {
    const celeb = document.getElementById('amCeleb').value.trim();
    const items = Array.from(document.querySelectorAll('#amCatalogo input:checked')).map(c=>c.value);
    if(items.length===0){ msg.style.color='var(--danger)'; msg.textContent='Selecciona al menos una amenidad.'; return; }

    // Se ancla al mediodía local para que la fecha no se recorra por zona horaria.
    const fechaEntrega = new Date(fecha + 'T12:00:00');
    data = {
      tipo: 'Amenidad', habitacion: hab, huesped, tipoCelebracion: celeb, notas,
      amenidades: items,
      fechaEntrega: firebase.firestore.Timestamp.fromDate(fechaEntrega),
      estatus: 'Solicitada',
      creadoPor: currentUser,
      creadoFecha: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      fotoURL: null,
      historial: [{ estatus:'Solicitada', autor: currentUser, fecha: firebase.firestore.Timestamp.now() }]
    };
    payload = { tipo:'Amenidad', habitacion: hab, huesped, tipoCelebracion: celeb, amenidades: items, notas, fecha };
  }

  const ref = await db.collection('amenidades').add(data);
  enviarACalendario({ id: ref.id, ...payload });

  // limpiar
  document.getElementById('amHab').value='';
  document.getElementById('amHuesped').value='';
  document.getElementById('amCeleb').value='';
  document.getElementById('amNotas').value='';
  document.getElementById('amHora').value='';
  document.getElementById('amPersonas').value='';
  document.getElementById('amDesc').value='';
  document.querySelectorAll('#amCatalogo input:checked').forEach(c=>c.checked=false);
  msg.style.color='var(--gold)';
  msg.textContent='Solicitud registrada ✓';
  setTimeout(()=>msg.textContent='',2500);
};

function enviarACalendario(payload){
  if(!AMEN_CALENDAR_URL) return;
  fetch(AMEN_CALENDAR_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // evita preflight CORS con Apps Script
    body: JSON.stringify(payload)
  }).catch(e=>console.warn('Calendario:', e));
}

/* ---------- Listeners en tiempo real ---------- */
function iniciarListenerAmenidades(){
  db.collection('amenidades')
    .where('estatus','in', AMEN_ACTIVAS)
    .orderBy('fechaEntrega','asc')
    .onSnapshot(snap=>{
      window._amenActivas = snap.docs;
      document.getElementById('amenError').textContent='';
      renderAmenActivas();
    }, err=>{
      console.error(err);
      document.getElementById('amenError').textContent =
        'Firestore necesita un índice para esta consulta. Abre la consola (F12), copia el link del error y pégalo en el navegador para crearlo.';
    });

  db.collection('amenidades')
    .where('estatus','==','Entregada')
    .orderBy('updatedAt','desc')
    .limit(20)
    .onSnapshot(snap=>{ window._amenEntregadas = snap.docs; renderAmenEntregadas(); },
                err=>console.error(err));
}

function etiquetaEntrega(ts, hora){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const diff = Math.round((dd - hoy)/86400000);
  const f = d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'});
  let cls='entregaProx', txt='en '+diff+'d · '+f;
  if(diff<0){ cls='entregaVencida'; txt='vencida · '+f; }
  else if(diff===0){ cls='entregaHoy'; txt='hoy · '+f; }
  else if(diff===1){ txt='mañana · '+f; }
  if(hora) txt += ' · ' + hora;
  return `<span class="entregaLabel ${cls}">${txt}</span>`;
}

function renderAmenCard(id, x, entregada){
  const esDes = x.tipo === 'Desayuno de madrugada';
  const trace = (x.historial||[]).map(h=>`<div class="t"><b>${escapeHtml(h.estatus)}</b> — ${escapeHtml(h.autor)} · ${fmtFecha(h.fecha)}</div>`).join('');

  const tipoTag = esDes
    ? `<span class="tipoTag tipoDes">Desayuno de madrugada</span>`
    : `<span class="tipoTag tipoAmen">Amenidad</span>`;

  // Cuerpo según el tipo
  let cuerpo;
  if(esDes){
    cuerpo = `
      <div class="amenDatos">
        ${x.hora ? `<span class="horaBig">${escapeHtml(x.hora)}</span>` : ''}
        ${x.personas ? `<span class="dato">${escapeHtml(String(x.personas))} pax</span>` : ''}
        ${x.lugarEntrega ? `<span class="dato">Entregar en: ${escapeHtml(x.lugarEntrega)}</span>` : ''}
      </div>
      ${x.descripcionDesayuno ? `<p class="cardDetalle">${escapeHtml(x.descripcionDesayuno)}</p>` : ''}`;
  }else{
    const items = (x.amenidades||[]).map(a=>`<li>${escapeHtml(a)}</li>`).join('');
    cuerpo = `<ul class="amenItems">${items}</ul>`;
  }

  let acciones='';
  if(!entregada){
    if(x.estatus==='Solicitada')          acciones = `<button class="btn-ghost" onclick="amenReconocer('${id}')">Cocina: reconocer</button>`;
    else if(x.estatus==='En preparación') acciones = `<button class="btn-ghost" onclick="amenMarcarLista('${id}')">Cocina: marcar lista</button>`;
    else if(x.estatus==='Lista')          acciones = `<button class="btn-primary" style="width:auto;" onclick="amenEntregar('${id}')">Restaurante: entregar + foto</button>`;
  }

  const foto = x.fotoURL ? `<div class="fotoEvidencia"><img src="${x.fotoURL}" onclick="window.open('${x.fotoURL}','_blank')" alt="Evidencia de entrega"></div>` : '';
  const resguardo = x.resguardo ? `<p class="cardDetalle" style="color:var(--cactus);"><b>Resguardo:</b> ${escapeHtml(x.resguardo)}</p>` : '';

  return `
  <div class="card">
    <div class="cardHead">
      <div>
        <p class="cardTitle">Hab. ${escapeHtml(x.habitacion||'—')} · ${escapeHtml(x.huesped||'—')}</p>
        <div style="margin-top:4px;">
          ${tipoTag}
          ${(!esDes && x.tipoCelebracion) ? `<span class="amenCeleb">${escapeHtml(x.tipoCelebracion)}</span>` : ''}
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        ${etiquetaEntrega(x.fechaEntrega, esDes ? x.hora : null)}
        <span class="badge ${badgeClass(x.estatus)}">${x.estatus}</span>
      </div>
    </div>
    ${cuerpo}
    ${x.notas ? `<p class="cardDetalle">${escapeHtml(x.notas)}</p>` : ''}
    ${resguardo}
    ${foto}
    ${trace ? `<div class="amenTrace">${trace}</div>` : ''}
    ${acciones ? `<div class="actionsRow">${acciones}</div>` : ''}
    <div class="cardFooter">
      <a class="editar" onclick="abrirAmEditar('${id}')">Editar</a>
      ${entregada ? `<a class="eliminar" onclick="eliminarAmen('${id}')">Eliminar</a>` : ''}
    </div>
  </div>`;
}

/* ---------- Sub-pestañas y filtros ---------- */
document.querySelectorAll('#amenSubnav .subBtn').forEach(b=>{
  b.onclick = ()=>amenToggleView(b.dataset.amenview);
});
function amenToggleView(view){
  document.querySelectorAll('#amenSubnav .subBtn').forEach(b=>b.classList.toggle('active', b.dataset.amenview===view));
  document.getElementById('amenViewActivas').style.display   = view==='activas'   ? '' : 'none';
  document.getElementById('amenViewHistorial').style.display = view==='historial' ? '' : 'none';
}

['amFBuscar','amFTipo','amFEstatus'].forEach(id=>{
  const el = document.getElementById(id);
  el.oninput = renderAmenActivas; el.onchange = renderAmenActivas;
});
['amFBuscarH','amFTipoH'].forEach(id=>{
  const el = document.getElementById(id);
  el.oninput = renderAmenEntregadas; el.onchange = renderAmenEntregadas;
});

function amenMatch(x, term){
  if(!term) return true;
  const hay = [x.habitacion, x.huesped, x.tipoCelebracion, x.descripcionDesayuno, x.notas, x.lugarEntrega, (x.amenidades||[]).join(' ')]
    .filter(Boolean).join(' ').toLowerCase();
  return hay.includes(term);
}

function renderAmenActivas(){
  const term  = (document.getElementById('amFBuscar').value||'').trim().toLowerCase();
  const fTipo = document.getElementById('amFTipo').value;
  const fEst  = document.getElementById('amFEstatus').value;
  const docs = (window._amenActivas || []).filter(d=>{
    const x = d.data();
    if(fTipo && (x.tipo||'Amenidad')!==fTipo) return false;
    if(fEst && x.estatus!==fEst) return false;
    return amenMatch(x, term);
  });
  const list = document.getElementById('amenActivasList');
  if(docs.length===0){
    list.innerHTML = '<div class="emptyState">Sin solicitudes activas con estos filtros.</div>';
    return;
  }
  list.innerHTML = docs.map(d=>renderAmenCard(d.id, d.data(), false)).join('');
}

function renderAmenEntregadas(){
  const term  = (document.getElementById('amFBuscarH').value||'').trim().toLowerCase();
  const fTipo = document.getElementById('amFTipoH').value;
  const docs = (window._amenEntregadas || []).filter(d=>{
    const x = d.data();
    if(fTipo && (x.tipo||'Amenidad')!==fTipo) return false;
    return amenMatch(x, term);
  });
  const list = document.getElementById('amenEntregadasList');
  if(docs.length===0){
    list.innerHTML = '<div class="emptyState">Sin entregas con estos filtros.</div>';
    return;
  }
  list.innerHTML = docs.map(d=>renderAmenCard(d.id, d.data(), true)).join('');
}

/* ---------- Transiciones de estado ---------- */
async function amenReconocer(id){
  await db.collection('amenidades').doc(id).update({
    estatus:'En preparación',
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    historial: firebase.firestore.FieldValue.arrayUnion({ estatus:'En preparación', autor: currentUser, fecha: firebase.firestore.Timestamp.now() })
  });
}
async function amenMarcarLista(id){
  await db.collection('amenidades').doc(id).update({
    estatus:'Lista',
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    historial: firebase.firestore.FieldValue.arrayUnion({ estatus:'Lista', autor: currentUser, fecha: firebase.firestore.Timestamp.now() })
  });
}
function amenEntregar(id){
  const doc = (window._amenActivas||[]).find(d=>d.id===id);
  const x = doc ? doc.data() : {};
  const esDes = x.tipo === 'Desayuno de madrugada';

  let resguardo = null;
  if(esDes){
    resguardo = prompt('¿Dónde queda en resguardo el desayuno? (obligatorio)');
    if(resguardo === null) return; // canceló
    if(!resguardo.trim()){ alert('El resguardo es obligatorio para cerrar un desayuno de madrugada.'); return; }
  }

  const input = document.createElement('input');
  input.type='file'; input.accept='image/*'; input.capture='environment';
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    amenToast('Subiendo foto…');
    try{
      const nombre = Date.now() + '_' + file.name.replace(/[^\w.\-]/g,'_');
      const ref = storage.ref('amenidades/' + id + '/' + nombre);
      const snap = await ref.put(file);
      const url = await snap.ref.getDownloadURL();
      const upd = {
        estatus:'Entregada',
        fotoURL: url,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        historial: firebase.firestore.FieldValue.arrayUnion({ estatus:'Entregada', autor: currentUser, fecha: firebase.firestore.Timestamp.now() })
      };
      if(esDes) upd.resguardo = resguardo.trim();
      await db.collection('amenidades').doc(id).update(upd);
      amenToast('Entregada ✓'); setTimeout(amenToastHide, 1800);
    }catch(e){
      console.error(e);
      amenToastHide();
      alert('No se pudo subir la foto: ' + e.message);
    }
  };
  input.click();
}

/* ---------- Editar solicitud de amenidad ---------- */
function toISODate(d){
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function buscarAmenDoc(id){
  const arr = [...(window._amenActivas||[]), ...(window._amenEntregadas||[])];
  const hit = arr.find(d=>d.id===id);
  return hit ? hit.data() : null;
}
function abrirAmEditar(id){
  const x = buscarAmenDoc(id);
  if(!x){ alert('No se encontró la solicitud. Recarga la página.'); return; }
  const esDes = x.tipo === 'Desayuno de madrugada';
  document.getElementById('edamId').value = id;
  document.getElementById('edamTipoLbl').textContent = x.tipo || 'Amenidad';
  document.getElementById('edamCamposAmenidad').style.display = esDes ? 'none' : '';
  document.getElementById('edamCamposDesayuno').style.display = esDes ? '' : 'none';
  document.getElementById('edamHab').value = x.habitacion || '';
  document.getElementById('edamHuesped').value = x.huesped || '';
  const d = (x.fechaEntrega && x.fechaEntrega.toDate) ? x.fechaEntrega.toDate() : null;
  document.getElementById('edamFecha').value = d ? toISODate(d) : '';
  document.getElementById('edamNotas').value = x.notas || '';
  if(esDes){
    document.getElementById('edamHora').value = x.hora || '';
    document.getElementById('edamPersonas').value = x.personas || '';
    document.getElementById('edamLugar').value = x.lugarEntrega || 'Habitación';
    document.getElementById('edamDesc').value = x.descripcionDesayuno || '';
  }else{
    document.getElementById('edamCeleb').value = x.tipoCelebracion || '';
    renderCatalogoEn(document.getElementById('edamCatalogo'), 'edam', x.amenidades || []);
  }
  document.getElementById('amEditOverlay').classList.add('open');
}
function cerrarAmEdit(){ document.getElementById('amEditOverlay').classList.remove('open'); }

async function eliminarAmen(id){
  const x = buscarAmenDoc(id);
  const nombre = x ? ('Hab. ' + (x.habitacion||'—') + ' · ' + (x.huesped||'')) : 'esta solicitud';
  if(!confirm('¿Eliminar definitivamente "' + nombre + '"?\n\nEsta acción no se puede deshacer.')) return;
  // Best-effort: borrar la(s) foto(s) de evidencia del Storage.
  try{
    const dir = storage.ref('amenidades/' + id);
    const res = await dir.listAll();
    await Promise.all(res.items.map(it=>it.delete()));
  }catch(e){ console.warn('Limpieza de Storage:', e); }
  await db.collection('amenidades').doc(id).delete();
}

async function guardarAmEdicion(){
  const id = document.getElementById('edamId').value;
  const x = buscarAmenDoc(id);
  const esDes = x && x.tipo === 'Desayuno de madrugada';
  const hab = document.getElementById('edamHab').value.trim();
  const huesped = document.getElementById('edamHuesped').value.trim();
  const fecha = document.getElementById('edamFecha').value;
  const notas = document.getElementById('edamNotas').value.trim();
  if(!hab || !huesped || !fecha){ alert('Faltan habitación, huésped o fecha.'); return; }

  const upd = {
    habitacion: hab, huesped, notas,
    editadoPor: currentUser,
    editadoFecha: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  if(esDes){
    const hora = document.getElementById('edamHora').value;
    if(!hora){ alert('Falta la hora de entrega.'); return; }
    upd.hora = hora;
    upd.personas = document.getElementById('edamPersonas').value.trim();
    upd.lugarEntrega = document.getElementById('edamLugar').value;
    upd.descripcionDesayuno = document.getElementById('edamDesc').value.trim();
    upd.fechaEntrega = firebase.firestore.Timestamp.fromDate(new Date(fecha + 'T' + hora + ':00'));
  }else{
    upd.tipoCelebracion = document.getElementById('edamCeleb').value.trim();
    upd.amenidades = Array.from(document.querySelectorAll('#edamCatalogo input:checked')).map(c=>c.value);
    upd.fechaEntrega = firebase.firestore.Timestamp.fromDate(new Date(fecha + 'T12:00:00'));
  }
  await db.collection('amenidades').doc(id).update(upd);
  cerrarAmEdit();
}

function amenToast(txt){  let t = document.getElementById('amenToast');
  if(!t){
    t = document.createElement('div'); t.id='amenToast';
    t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--pacific);color:var(--wool);padding:10px 16px;border-radius:3px;font-size:12px;z-index:100;';
    document.body.appendChild(t);
  }
  t.textContent = txt; t.style.display='block';
}
function amenToastHide(){ const t=document.getElementById('amenToast'); if(t) t.style.display='none'; }

/* ---------------- TEMA (claro / oscuro) ---------------- */
function actualizarIconoTema(){
  const oscuro = document.documentElement.getAttribute('data-theme') === 'dark';
  const b = document.getElementById('themeToggle');
  if(b) b.textContent = oscuro ? '☀' : '☾';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('cy-theme', next); }catch(e){}
  actualizarIconoTema();
}
actualizarIconoTema();

/* ---------------- BOOT ---------------- */
(async function boot(){
  // Hay que autenticar (anónimo) ANTES de leer Firestore, porque las reglas
  // de seguridad exigen request.auth != null incluso para ver la lista de
  // recepcionistas en la pantalla de login.
  try{
    await auth.signInAnonymously();
  }catch(e){
    document.getElementById('loginError').textContent =
      'No se pudo conectar con Firebase. Revisa que "Anónimo" esté activado en Authentication y que este dominio esté en Authorized domains.';
    console.error(e);
    return;
  }
  await cargarUsuarios();
  const sesion = loadSession();
  if(sesion){
    currentUser = sesion.nombre;
    currentDept = sesion.departamento || 'Recepción';
    mostrarApp();
  }
})();
